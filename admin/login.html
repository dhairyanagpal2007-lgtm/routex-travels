
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login - Route X</title>

    <style>
        body {
            font-family: Arial;
            background: #edf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            width: 320px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        button {
            border: none;
            color: white;
            background: #087f8c;
            cursor: pointer;
        }

        #error {
            color: red;
        }

        body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.project-disclaimer {
    width: 100%;
    background: #007bff;
    color: white;
    text-align: center;
    padding: 12px 15px;
    box-sizing: border-box;
    margin-top: auto;
}

.project-disclaimer p {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
}
    </style>
</head>

<body>

<div class="login-box">

    <h2>Route X Admin</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

        <p id="error"></p>

    </form>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async event => {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (!response.ok) {
            document.getElementById("error").textContent =
                result.message;
            return;
        }

        window.location.href = "/admin/dashboard.html";

    } catch (error) {

        document.getElementById("error").textContent =
            "Server connection failed.";

    }
});
</script>


<footer class="project-disclaimer">
    <p>
        Disclaimer: This is a non-commercial academic 
        college project built strictly for educational
        and demonstration purposes. All hotel listings,
        prices, payment options, and bookings are simulated,
        and no real financial transactions take place
        on this website.
    </p>
</footer>


</body>
</html>
